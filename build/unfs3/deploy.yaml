apiVersion: v1
kind: Namespace
metadata:
  name: unfs3-storage
spec: {}
status: {}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: unfs3
  namespace: unfs3-storage
  labels:
    app: unfs3
spec:
  replicas: 1
  selector:
    matchLabels:
      app: unfs3
  template:
    metadata:
      labels:
        app: unfs3
    spec:
      containers:
        - name: nfsd
          image: unfs3:0.1.0
          imagePullPolicy: Never
          securityContext:
            privileged: true
            readOnlyRootFilesystem: false
          ports:
            - containerPort: 111
              name: sunrpc-tcp
              protocol: TCP
            - containerPort: 111
              name: sunrpc-udp
              protocol: UDP
            - containerPort: 662
              name: statd-tcp
              protocol: TCP
            - containerPort: 662
              name: statd-udp
              protocol: UDP
            - containerPort: 2049
              name: nfs
              protocol: TCP
          volumeMounts:
            - mountPath: /vol
              name: exports
      nodeSelector:
        node-role.kubernetes.io/control-plane: ""
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
      securityContext:
        runAsUser: 0
        runAsGroup: 0
        fsGroup: 1000
      volumes:
        - name: exports
          hostPath:
            path: /exports
            type: Directory
---
apiVersion: v1
kind: Service
metadata:
  name: unfs3
  namespace: unfs3-storage
  labels:
    app: unfs3
spec:
  selector:
    app: unfs3
  ports:
    - name: sunrpc-tcp
      port: 111
      protocol: TCP
      targetPort: 111
    - name: sunrpc-udp
      port: 111
      protocol: UDP
      targetPort: 111
    - name: statd-tcp
      port: 662
      protocol: TCP
      targetPort: 662
    - name: statd-udp
      port: 662
      protocol: UDP
      targetPort: 662
    - name: nfs
      port: 2049
      protocol: TCP
      targetPort: 2049
